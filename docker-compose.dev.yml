services:
  backend:
    image: tuna99/openshorts-backend-dev:latest
    volumes:
      - .:/app
      - backend_models:/app/models
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./temp:/app/temp
      - ./clips:/app/clips
    environment:
      - PATH=/opt/venv/bin:$PATH
      - YOLO_MODEL_PATH=/app/models/yolov8n.pt
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/cache
      - ULTRALYTICS_CONFIG_DIR=/tmp/Ultralytics
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - CUDA_HOME=/usr/local/cuda
      - TRANSCRIPTION_PROVIDER=${TRANSCRIPTION_PROVIDER:-local}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_TRANSCRIPTION_MODEL=${GROQ_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      - GROQ_TRANSCRIPTION_BASE_URL=${GROQ_TRANSCRIPTION_BASE_URL:-https://api.groq.com/openai/v1}
      - TRANSCRIPTION_CHUNK_SECONDS=${TRANSCRIPTION_CHUNK_SECONDS:-600}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  backend_models:
